
services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: fundamentos_db
      POSTGRES_USER: ups
      POSTGRES_PASSWORD: ups123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ups -d fundamentos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/fundamentos_db
      DB_USERNAME: ups
      DB_PASSWORD: ups123
      JWT_SECRET: secreto-super-seguro-para-produccion-minimo-256-bits-fundamentos
      JWT_EXPIRATION: 3600000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: