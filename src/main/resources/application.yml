server:
  servlet:
    context-path: /api

spring:
  application:
    name: fundamentos-api
  datasource:
    # Valores por defecto para que funcione localmente con bootRun
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:ups}
    password: ${DB_PASSWORD:ups123}
  jpa:
    hibernate:
      # CAMBIO CRUCIAL: 'update' para que cree la tabla refresh_tokens
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # Ajuste para quitar la advertencia de Deprecated:
  web:
    error:
      include-message: always
      include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWT2024MustBeAtLeast256BitsLongForHS256Algorithm}
  expiration: 1800000
  refresh-expiration: 604800000
  issuer: fundamentos01-api
  header: Authorization
  prefix: "Bearer "