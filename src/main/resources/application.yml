server:
  servlet:
    context-path: /api

spring:
  application:
    name: fundamentos-api
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # Ajuste para quitar la advertencia de Deprecated:
  web:
    error:
      include-message: always
      include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

jwt:
  issuer: fundamentos01-api
  header: Authorization
  prefix: "Bearer "